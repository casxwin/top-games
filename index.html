            --border-subtle: #262b31;
            --accent-calm: #2ebd85;
            --accent-text: #0b1f17;
            --vpn-bg: #221c14;
            --vpn-border: #4d3b22;
            --vpn-text: #e5b869;
            --text-primary: #f1f5f9;
            --text-secondary: #8b95a5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px 16px 40px 16px;
            display: flex;
            justify-content: center;
        }

        .container {

            max-width: 420px;
        }

        /* --- Спокойная плашка про VPN --- */
        .vpn-notice {
            background-color: var(--vpn-bg);
            border: 1px solid var(--vpn-border);
            color: var(--vpn-text);
            border-radius: 14px;
            padding: 12px 16px;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 16px;
            letter-spacing: 0.2px;
        }

        /* --- Кнопка Telegram --- */
        .tg-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 14px 16px;
            text-decoration: none;
            margin-bottom: 24px;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .tg-link:hover {
            background-color: var(--bg-card-hover);
        }

        .tg-link:active {
            transform: scale(0.99);
        }

        .tg-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tg-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background-color: #232830;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
        }

        .tg-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .tg-sub {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .tg-btn {
            background-color: #262b31;
            color: var(--text-primary);
            font-size: 0.82rem;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 10px;
        }

        /* --- Разделитель --- */
        .section-label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 10px;
            padding-left: 4px;
        }

        /* --- Список игр --- */
        .games-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 32px;
        }

        .game-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 10px 12px;
            text-decoration: none;
            transition: background-color 0.2s ease, transform 0.15s ease;
        }

        .game-item:hover {
            background-color: var(--bg-card-hover);
        }

        .game-item:active {
            transform: scale(0.99);
        }

        .game-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .game-img {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            object-fit: cover;
            background-color: #111315;
        }

        .game-name {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .play-btn {

            color: var(--accent-text);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 10px 18px;
            border-radius: 11px;
        }

        /* --- Подвал --- */
        .footer {

            font-size: 0.75rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }
    </style>
</head>
